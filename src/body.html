<canvas id="confetti" aria-hidden="true"></canvas>

<!-- tap to start (also unlocks sound on iPhone) -->
<section id="splash" class="screen active">
  <img src="img/lion.webp" alt="" id="splashAv">
  <div class="logo">Palabr<span>itas</span></div>
  <div class="tag">Spanish for little learners · Pre-K to 1st Grade</div>
  <button class="big-btn" data-act="start" style="min-width:220px">▶ Play</button>
  <p class="note small">Everything is saved only on this device. No accounts, no ads, no tracking.</p>
</section>

<!-- HOME -->
<section id="home" class="screen">
  <header class="top">
    <button class="kid-btn" data-act="kid" aria-label="Switch child" id="kidBtn"></button>
    <div><div class="hello" id="hello"></div><div class="sub">Let's learn some Spanish!</div></div>
    <button class="icon-btn" data-act="dash" aria-label="Progress for grown-ups">📊</button>
    <button class="icon-btn" data-act="settings" aria-label="Grown-up settings">⚙️</button>
  </header>
  <div class="chips">
    <span class="chip" id="starChip">⭐ <b id="starN">0</b></span>
    <button class="chip" data-act="grade" id="gradeChip">🎓 <b id="gradeN"></b></button>
    <button class="chip" data-act="stickers">🏅 <b id="stickN">0</b> stickers ›</button>
  </div>
  <button class="banner" id="banner" data-act="banner"></button>
  <div class="grid" id="grid"></div>
</section>

<!-- TOPIC -->
<section id="topic" class="screen">
  <header class="play-top">
    <button class="nav-btn" data-act="go" data-k="home" aria-label="Home"><span class="i">🏠</span>Home</button>
    <div class="play-title" id="tTitle"></div>
    <button class="nav-btn" data-act="sayTopic" aria-label="Hear the topic name"><span class="i">🔊</span>Hear</button>
  </header>
  <nav class="lvls" id="lvls" aria-label="Levels"></nav>
  <div class="acts" id="acts"></div>
  <div class="preview" id="preview"></div>
</section>

<!-- LEARN (flashcards) -->
<section id="learn" class="screen">
  <header class="play-top">
    <button class="nav-btn" data-act="go" data-k="topic" aria-label="Back"><span class="i">‹</span>Back</button>
    <div class="play-title" id="lTitle"></div>
    <button class="nav-btn" data-act="hear" aria-label="Hear it again"><span class="i">🔊</span>Hear</button>
  </header>
  <div id="learnBody"></div>
</section>

<!-- ROUND (listen / spell / build / match) -->
<section id="round" class="screen">
  <header class="play-top">
    <button class="nav-btn" data-act="go" data-k="back" aria-label="Stop and go back"><span class="i">‹</span>Back</button>
    <div class="play-title" id="rTitle"></div>
    <button class="nav-btn" data-act="replay" aria-label="Hear it again"><span class="i">🔊</span>Hear</button>
  </header>
  <div class="prog" id="prog"></div>
  <div id="roundBody"></div>
</section>

<!-- RESULT -->
<section id="result" class="screen result"></section>

<!-- STICKERS -->
<section id="stickers" class="screen">
  <header class="play-top">
    <button class="nav-btn" data-act="go" data-k="home" aria-label="Home"><span class="i">🏠</span>Home</button>
    <div class="play-title">My stickers</div>
    <span class="spacer" aria-hidden="true"></span>
  </header>
  <p class="note" id="stickNote"></p>
  <div class="sgrid" id="sgrid"></div>
</section>

<!-- GROWN-UPS: progress -->
<section id="dash" class="screen">
  <header class="play-top">
    <button class="nav-btn" data-act="go" data-k="grown" aria-label="Back"><span class="i">‹</span>Back</button>
    <div class="play-title" id="dTitle"></div>
    <span class="spacer" aria-hidden="true"></span>
  </header>
  <div id="dashBody" style="display:flex;flex-direction:column;gap:16px"></div>
</section>

<!-- GROWN-UPS: settings -->
<section id="settings" class="screen">
  <header class="play-top">
    <button class="nav-btn" data-act="go" data-k="home" aria-label="Home"><span class="i">🏠</span>Home</button>
    <div class="play-title">Grown-up settings</div>
    <span class="spacer" aria-hidden="true"></span>
  </header>
  <div id="setBody" style="display:flex;flex-direction:column;gap:16px"></div>
</section>

<!-- content review (read-only, for checking every card) -->
<section id="review" class="screen">
  <header class="play-top">
    <button class="nav-btn" data-act="go" data-k="grown" aria-label="Back"><span class="i">‹</span>Back</button>
    <div class="play-title">All content<small>Every card, by topic and level</small></div>
    <span class="spacer" aria-hidden="true"></span>
  </header>
  <div id="revBody" style="display:flex;flex-direction:column;gap:16px"></div>
</section>

<div id="sheetBox"></div>
<div id="toastBox"></div>
